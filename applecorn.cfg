# Applecorn linker configuration for Commodore 128
# Produces two output files:
#   aC=orn.prg  - Loader at $2000
#   loadmos.prg - MOS code at $D000

MEMORY {
    ZP:       start = $0000, size = $0100, type = rw;
    RAM:      start = $0200, size = $1E00, type = rw;
    LOADER:   start = $2000, size = $1C00, type = rw, file = %O;
    MOSSEG:   start = $C000, size = $1000, type = rw, file = "loadmos.prg";
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOWRAM:   load = RAM,      type = rw,  optional = yes;
    CODE:     load = LOADER,   type = rw;
    MOSCODE:  load = MOSSEG,   type = rw;
}
